<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AD-CausalRisk · 阿尔茨海默病因果风险预测平台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <title>AD-CausalRisk · 因果风险评估平台</title>
    <style>
      /*
        3D 登录页的 .screen / .brain-stage 需要直接落在 body 下才能铺满视口，
        挂载点因此不参与布局；业务页各自用 min-height:100vh 自理。
      */
      #app { display: contents; }
      html, body { margin: 0; padding: 0; }

      /* 首屏 / 刷新加载动画：brain + 二进制环，Vue 挂载后由 main.js 移除 */
      .app-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        transition: opacity 360ms ease;
        pointer-events: none;
      }
      .app-boot--done { opacity: 0; }
      .boot-logo {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        width: 230px;
      }
      .boot-svg { width: 230px; height: 230px; overflow: visible; }
      .boot-outline { fill: none; stroke: #e1f0ed; stroke-width: 1.6; }
      .boot-ring {
        transform-origin: 120px 120px;
        animation: boot-ring-spin 40s linear infinite;
      }
      .boot-ring text {
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        font-size: 9.5px;
        letter-spacing: 3.2px;
        fill: #bccdc8;
      }
      .boot-brain {
        transform: scale(1.1);
        transform-origin: 120px 120px;
      }

      .boot-brain__shape {
        fill: #eef8f5;
        stroke: #3f7a76;
        stroke-width: 2.4;
        stroke-linejoin: round;
      }
      .boot-brain__stem {
        fill: none;
        stroke: #3f7a76;
        stroke-width: 2.4;
        stroke-linecap: round;
      }
      .boot-brain__folds {
        fill: none;
        stroke: #6fa39e;
        stroke-width: 1.6;
        stroke-linecap: round;
      }
      .boot-brain__links { stroke: #9db8b3; stroke-width: 1; }
      .boot-brain__nodes circle { fill: #7f9c98; stroke: #f4fbf9; stroke-width: 1; }
      .boot-label {
        margin: 0;
        font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.3px;
        color: #4a746f;
        text-align: center;
      }
      .boot-dots i {
        font-style: normal;
        animation: boot-dot 1.25s ease-in-out infinite;
      }
      .boot-dots i:nth-child(2) { animation-delay: 0.18s; }
      .boot-dots i:nth-child(3) { animation-delay: 0.36s; }
      @keyframes boot-ring-spin { to { transform: rotate(360deg); } }
      @keyframes boot-dot {
        0%, 100% { opacity: 0.15; }
        40% { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring, .boot-dots i { animation-duration: 80s; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="app-boot" aria-live="polite">
      <div class="boot-logo">
        <svg class="boot-svg" viewBox="0 0 240 240" aria-hidden="true">
          <defs>
            <path id="boot-digit-ring" d="M120,20 a100,100 0 1,1 -0.01,0" />
          </defs>
          <circle class="boot-outline" cx="120" cy="120" r="110" />
          <g class="boot-ring">
            <text>
              <textPath href="#boot-digit-ring" startOffset="0">01001011010001001011010001001011010001001011010001001011010001</textPath>
            </text>
          </g>
                    <g class="boot-brain">
            <path class="boot-brain__shape" d="M118,72 C104,64 88,68 84,82 C70,88 66,104 76,112 C68,124 76,138 90,138 C94,150 108,154 116,146 C118,140 118,132 117,124 C116,108 117,88 118,72 Z" />
            <path class="boot-brain__shape" d="M122,72 C136,64 152,68 156,82 C170,88 174,104 164,112 C172,124 164,138 150,138 C146,150 132,154 124,146 C122,140 122,132 123,124 C124,108 123,88 122,72 Z" />
            <path class="boot-brain__stem" d="M120,140 C120,152 124,164 132,172" />
            <g class="boot-brain__folds">
              <path d="M100,86 C94,98 96,110 104,118" />
              <path d="M90,104 C88,114 92,124 100,128" />
              <path d="M140,86 C146,98 144,110 136,118" />
              <path d="M150,104 C152,114 148,124 140,128" />
              <path d="M106,136 C112,142 128,142 134,136" />
            </g>
            <g class="boot-brain__links">
              <line x1="102" y1="98" x2="118" y2="110" />
              <line x1="138" y1="98" x2="122" y2="110" />
              <line x1="110" y1="126" x2="118" y2="110" />
              <line x1="130" y1="126" x2="122" y2="110" />
            </g>
            <g class="boot-brain__nodes">
              <circle cx="102" cy="98" r="3.2" />
              <circle cx="138" cy="98" r="3.2" />
              <circle cx="118" cy="110" r="3.2" />
              <circle cx="110" cy="126" r="3.2" />
              <circle cx="130" cy="126" r="3.2" />
            </g>
          </g>
        </svg>
        <p class="boot-label">正在载入工作台<span class="boot-dots"><i>.</i><i>.</i><i>.</i></span></p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
